  .logo span { color: var(--bleu-vif); }
  .nav-links { display: flex; gap: 32px; font-weight: 500; font-size: 0.95rem; }

  .btn {

    font-weight: 600;
    font-size: 0.95rem;
    transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    white-space: nowrap;
  }
  .btn-primaire { background: var(--bleu-vif); color: var(--blanc); }

  section { padding: 84px 0; }
  .section-bleu-vif { background: var(--bleu-vif); color: var(--blanc); }
  .section-titre { text-align: center; max-width: 620px; margin: 0 auto 48px; }

  /* FORMULAIRE DE QUALIFICATION */
  .formulaire {
    max-width: 580px;
    margin: 0 auto;
    background: var(--blanc);
    border-radius: var(--radius-lg);
    padding: 36px;
    text-align: left;

  .champ-groupe {

  .champ { margin-bottom: 20px; }
  .champ label { display: block; font-size: 0.88rem; font-weight: 600; color: var(--bleu-fonce); margin-bottom: 8px; }
  .champ input, .champ select, .champ textarea {

    font-size: 0.95rem;
    color: var(--bleu-fonce);
    background: #FAFCFF;
  }
  .champ input:focus, .champ select:focus, .champ textarea:focus {
    outline: none;
    border-color: var(--bleu-vif);
    background: var(--blanc);
  }
  .champ textarea { resize: vertical; min-height: 110px; }
  .formulaire .btn { width: 100%; margin-top: 10px; padding: 16px; font-size: 1rem; }

  .form-succes {

    text-align: center;

  .form-succes h3 { font-size: 1.6rem; margin-bottom: 10px; }
  .form-succes p { color: var(--gris); line-height: 1.5; }
</style>
